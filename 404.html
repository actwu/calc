<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" href="https://ise.web.app/fa/20.png" type="image/x-icon">
<title>calkyo</title>
<style>
:root {
  background: black;
  color: white;
  font-family: sans-serif;
}

::placeholder {
  color: #222;
}

::-webkit-scrollbar {
  background: black;
}
::-webkit-scrollbar-thumb {
  background: #222;
}

* {
  background: transparent;
  outline: unset;
  border: unset;
}

body {
  padding: 0.01in;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: auto;
  height: 100svh;
  max-width: 499px;
  justify-content: center;
  place-content: center;
  align-content: center;
}

span {
  display: flex;
  flex-direction: row;
  gap: 10px;
  justify-content: center;
  place-content: center;
  align-content: center;
}

span[out] {
  display: block;
  flex-direction: row;
  gap: 10px;
  justify-content: center;
  place-content: center;
  align-content: center;
}

p {
  min-width: 0in;
}

a {
  background-color: rgb(48, 48, 59);
  padding: 0.3in;
  display: flex;
  height: 0.1in;
  justify-content: center;
  place-content: center;
  align-content: center;
  flex: 1;
  border-radius: 15px;
}

[c] {
  background-color: rgb(107, 107, 168);
}

[p] {
  background-color: rgb(57, 57, 156);
}

[s] a {
  width: auto;
  max-width: 599px;
  flex: 1;
}
</style>
</head>
<body>

<span out>
  <p>Result</p>
  <p id="meh"></p>
</span>

<span s>
  <a c onmousedown="press(this)">C</a>
  <a onmousedown="press(this)">/</a>
</span>
<span>
  <a onmousedown="press(this)">7</a>
  <a onmousedown="press(this)">8</a>
  <a onmousedown="press(this)">9</a>
  <a p onmousedown="press(this)">x</a>
</span>
<span>
  <a onmousedown="press(this)">4</a>
  <a onmousedown="press(this)">5</a>
  <a onmousedown="press(this)">6</a>
  <a p onmousedown="press(this)">-</a>
</span>
<span>
  <a onmousedown="press(this)">1</a>
  <a onmousedown="press(this)">2</a>
  <a onmousedown="press(this)">3</a>
  <a p onmousedown="press(this)">+</a>
</span>
<span>
  <a onmousedown="press(this)">0</a>
  <a p onmousedown="press(this)">=</a>
</span>

<script>
const press = el => {
  const text = el.textContent.trim();
  if (text === 'C') {
    meh.textContent = '';
  } else if (text === '=') {
    calc(meh.textContent);
  } else if (text === 'x') {
    meh.textContent += '*';
  } else {
    meh.textContent += text;
  }
};

const calc = expression => {
  if (!expression) {
    meh.textContent = '';
    return;
  }
  if (!/^[0-9+\-*/().]+$/.test(expression)) {
    meh.textContent = 'Error';
    return;
  }
  if (!isBalanced(expression)) {
    meh.textContent = 'Error';
    return;
  }
  if (/[\+\-\*\/]{2,}/.test(expression)) {
    meh.textContent = 'Error';
    return;
  }
  try {
    const result = Function('"use strict"; return (' + expression + ')')();
    meh.textContent = result;
  } catch (e) {
    meh.textContent = 'Error';
  }
};

const isBalanced = str => {
  const stack = [];
  for (let i = 0; i < str.length; i++) {
    if (str[i] === '(') stack.push('(');
    if (str[i] === ')') {
      if (!stack.pop()) return false;
    }
  }
  return stack.length === 0;
};

  const expr = window.location.pathname.replace(/\//g, '').replace('calc', '');
if (expr) calc(expr);
  
</script>

</body>
    </html>
